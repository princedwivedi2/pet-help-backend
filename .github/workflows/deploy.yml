# Auto-deploy the Laravel backend to the EC2 server on push to main.
#
# Secrets required (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST  -> the server IP/host (e.g. 23.20.64.92)
#   SSH_USER  -> the SSH login user (e.g. ubuntu)
#   SSH_KEY   -> the PRIVATE deploy key (full contents, incl. BEGIN/END lines)
#   SSH_PORT  -> the SSH port (usually 22)
#   APP_PATH  -> absolute path to the app on the server (e.g. /var/www/laravel-app)
#
# No credentials are hardcoded here; everything sensitive comes from repo secrets.
#
# NOTE (landing assets): the compiled landing files (public/css, public/images, etc.)
# are committed to the repo, so `git pull` below already updates them on the server.
# No separate asset build/upload step is needed for the backend + its static pages.

name: Deploy backend to EC2

on:
  push:
    branches: [ main ]     # deploys fire when main is updated (you currently work on prince_dev)
  workflow_dispatch:        # allows a manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt an in-flight deploy

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true   # stop on first failed command
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"

            echo "==> Pulling latest code"
            git fetch --prune origin
            # Fast-forward only: fails loudly if the server has diverging local commits.
            git pull --ff-only origin main

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Rebuilding caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            # php artisan view:cache   # optional: precompile Blade views

            echo "==> Fixing storage / cache permissions"
            # Keep writable dirs owned by the web-server user (adjust if not www-data)
            sudo chown -R www-data:www-data storage bootstrap/cache || true
            sudo chmod -R 775 storage bootstrap/cache || true

            echo "==> Reloading PHP-FPM (best-effort; adjust service name if needed)"
            sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm || true

            echo "==> Deploy complete"
